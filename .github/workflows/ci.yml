name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peblo
          POSTGRES_PASSWORD: peblo
          POSTGRES_DB: peblo_tv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check app/ || true

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://peblo:peblo@localhost:5432/peblo_tv
          SYNC_DATABASE_URL: postgresql+psycopg2://peblo:peblo@localhost:5432/peblo_tv
        run: pytest -v

  build-images:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t peblo/api:${{ github.sha }} ./backend

      - name: Build CMS image
        run: docker build -t peblo/cms:${{ github.sha }} ./cms || echo "CMS not yet present"

      - name: Build viewer image
        run: docker build -t peblo/viewer:${{ github.sha }} ./viewer || echo "Viewer not yet present"
