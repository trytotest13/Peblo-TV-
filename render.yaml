services:
  - type: web
    name: peblo-tv-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: APP_ENV
        value: production
      - key: STORAGE_BACKEND
        value: local
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: peblo-db
          property: connectionString

databases:
  - name: peblo-db
    databaseName: peblo_tv
    user: peblo
